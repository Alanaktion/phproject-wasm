<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phproject — Loading…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Source Sans 3", "Source Sans Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #ecf0f1;
      color: #2c3e50;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border: 1px solid #dce4ec;
      border-radius: 6px;
      padding: 2.5rem 3rem;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 2px 8px rgba(44,62,80,0.08);
    }

    .logo {
      font-size: 2rem;
      font-weight: 300;
      color: #2c3e50;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    .tagline {
      color: #7b8a8b;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    #status-text {
      font-size: 1rem;
      color: #7b8a8b;
      min-height: 1.5em;
      margin-bottom: 1.5rem;
      white-space: pre-wrap;
    }

    .progress-bar-container {
      background: #dce4ec;
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .progress-bar {
      height: 100%;
      background: #18bc9c;
      border-radius: 999px;
      width: 0%;
      transition: width 0.4s ease;
    }
    .progress-bar.indeterminate {
      width: 40%;
      animation: slide 1.4s infinite ease-in-out;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      50%  { transform: translateX(150%); }
      100% { transform: translateX(400%); }
    }

    #error-box {
      display: none;
      background: #fdf2f2;
      border: 1px solid #e74c3c;
      border-radius: 4px;
      padding: 1rem;
      text-align: left;
      font-size: 0.85rem;
      color: #c0392b;
      word-break: break-word;
      white-space: pre-wrap;
      margin-bottom: 1rem;
    }

    .note {
      font-size: 0.8rem;
      color: #95a5a6;
      margin-top: 1.5rem;
    }
    .note a { color: #18bc9c; }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1a1f2e;
        color: #ecf0f1;
      }
      .card {
        background: #252d3d;
        border-color: #2c3e50;
        box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      }
      .logo {
        color: #ecf0f1;
      }
      .tagline, #status-text {
        color: #95a5a6;
      }
      .progress-bar-container {
        background: #2c3e50;
      }
      #error-box {
        background: #2d1a1a;
        border-color: #e74c3c;
        color: #e8a09a;
      }
      .note {
        color: #7f8c8d;
      }
      .note a { color: #1abc9c; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Phproject</div>
    <div class="tagline">Lightweight project management — running entirely in your browser</div>

    <div id="status-text">Initialising…</div>

    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar indeterminate"></div>
    </div>

    <div id="error-box"></div>

    <div class="note">
      Powered by <a href="https://github.com/seanmorris/php-wasm" target="_blank" rel="noopener">php-wasm</a>
      &amp; <a href="https://github.com/alanaktion/phproject" target="_blank" rel="noopener">Phproject</a>
    </div>
  </div>

  <script type="module">
    const statusEl   = document.getElementById('status-text');
    const progressEl = document.getElementById('progress-bar');
    const errorEl    = document.getElementById('error-box');

    function setStatus(msg) {
      statusEl.textContent = msg;
      console.log('[phproject-wasm]', msg);
    }

    function setProgress(pct) {
      progressEl.classList.remove('indeterminate');
      progressEl.style.width = pct + '%';
    }

    function showError(msg) {
      errorEl.style.display = 'block';
      errorEl.textContent   = msg;
      progressEl.classList.remove('indeterminate');
      progressEl.style.background = '#e74c3c';
      progressEl.style.width      = '100%';
      setStatus('Setup failed — see error below.');
    }

    // ── Wait for a service worker to reach a target state ────────────────────
    function waitForWorkerState(worker, targetState) {
      if (worker.state === targetState) return Promise.resolve(worker);
      return new Promise((resolve, reject) => {
        function handler() {
          if (this.state === targetState) {
            this.removeEventListener('statechange', handler);
            resolve(this);
          } else if (this.state === 'redundant') {
            this.removeEventListener('statechange', handler);
            reject(new Error('Service worker became redundant'));
          }
        }
        worker.addEventListener('statechange', handler);
      });
    }

    // ── Wait for the registration to have an active worker ───────────────────
    async function waitForActivation(reg) {
      if (reg.active) return waitForWorkerState(reg.active, 'activated');

      const worker = reg.installing || reg.waiting;
      if (worker) return waitForWorkerState(worker, 'activated');

      return new Promise((resolve, reject) => {
        reg.addEventListener('updatefound', () => {
          waitForWorkerState(reg.installing, 'activated').then(resolve).catch(reject);
        }, { once: true });
      });
    }

    // ── Direct message-passing helper ────────────────────────────────────────
    function isTransientSwError(error) {
      const text = String(error && error.message ? error.message : error).toLowerCase();
      return text.includes('database connection is closing')
        || text.includes('invalidstateerror')
        || text.includes('failed to execute \"transaction\"');
    }

    async function sendMessageOnce(action, params = []) {
      const reg = await navigator.serviceWorker.ready;
      if (!reg || !reg.active) {
        throw new Error('Service worker not active');
      }

      const token = crypto.randomUUID();
      return new Promise((resolve, reject) => {
        const handler = (event) => {
          if (event.data && event.data.re === token) {
            navigator.serviceWorker.removeEventListener('message', handler);
            if (event.data.error) {
              reject(new Error(typeof event.data.error === 'string'
                ? event.data.error
                : JSON.stringify(event.data.error)));
            } else {
              resolve(event.data.result);
            }
          }
        };

        navigator.serviceWorker.addEventListener('message', handler);
        reg.active.postMessage({ action, params, token });
      });
    }

    async function sendMessage(action, params = [], maxAttempts = 3) {
      let lastError;

      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        try {
          return await sendMessageOnce(action, params);
        } catch (error) {
          lastError = error;
          if (attempt >= maxAttempts || !isTransientSwError(error)) {
            throw error;
          }
          await new Promise(r => setTimeout(r, attempt * 250));
        }
      }

      throw lastError || new Error('Unknown service worker messaging error');
    }

    // ── Main installation flow ────────────────────────────────────────────────
    async function main() {
      // 1. Check for service-worker support
      if (!('serviceWorker' in navigator)) {
        showError('Service Workers are not supported in this browser.\n'
          + 'Please use a modern browser such as Chrome 91+, Firefox 116+, or Safari 16.4+.');
        return;
      }

      setStatus('Registering service worker…');

      // Clean up old /app-scoped registrations from earlier builds.
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) {
          const scopePath = new URL(reg.scope).pathname;
          if (scopePath.endsWith('/app/') || scopePath.endsWith('/app')) {
            await reg.unregister();
          }
        }
      } catch (_) {
        // Non-fatal; continue with registration.
      }

      let swReg;
      try {
        // Register scoped to the site root so the SW controls this page too.
        // Setup execution is triggered via SW message actions.
        // handleFetchEvent only calls respondWith() for /app/ prefix URLs,
        // so static files (index.html, sw.js, releases/, …) still hit the network.
        swReg = await navigator.serviceWorker.register('./sw.js', {
          type: 'module',
          scope: './',
        });
      } catch (err) {
        showError('Service worker registration failed: ' + err.message
          + '\n\nEnsure the page is served over HTTPS or localhost, '
          + 'and that sw.js is accessible at the root of the site.');
        return;
      }

      setStatus('Loading PHP WebAssembly runtime…\n(first load may take 20–60 s while runtime is fetched from CDN)');

      // 2. Wait for the SW to fully activate.
      //    The SW imports PhpCgiWorker.mjs from CDN during installation, which
      //    can take several seconds on a slow connection.
      try {
        await waitForActivation(swReg);
      } catch (err) {
        showError('Service worker activation failed: ' + err.message);
        return;
      }

      // On first install/update, reload once if this page is not controlled by
      // the same worker instance we just activated.
      const reloadFlag = 'phproject-wasm-sw-control-reload';
      const activeScript = swReg.active ? new URL(swReg.active.scriptURL).pathname : null;
      const controller = navigator.serviceWorker.controller;
      const controllerScript = controller ? new URL(controller.scriptURL).pathname : null;
      const hasMatchingController = !!controller
        && !!activeScript
        && controllerScript === activeScript;

      if (!hasMatchingController) {
        if (!sessionStorage.getItem(reloadFlag)) {
          sessionStorage.setItem(reloadFlag, '1');
          setStatus('Finalising service worker setup…');
          window.location.reload();
          return;
        }

        showError('Service worker activated but this page is still controlled by an older worker. '
          + 'Please unregister old service workers for this origin and try again.');
        return;
      }

      sessionStorage.removeItem(reloadFlag);

      setProgress(5);
      setStatus('Checking installation…');

      // 3. Check whether Phproject has already been set up in a previous visit
      let installCheck;
      try {
        installCheck = await sendMessage('analyzePath', ['/persist/phproject/config.php']);
      } catch (err) {
        showError('Could not communicate with service worker: ' + err.message);
        return;
      }

      if (installCheck && installCheck.exists) {
        setStatus('Phproject is already installed — redirecting…');
        setProgress(100);
        window.location.href = './app/';
        return;
      }

      // ── First-run installation ────────────────────────────────────────────

      // 4. Load release metadata (bundled at deploy time) for progress display
      setStatus('Loading Phproject release info…');
      setProgress(10);

      const zipUrl = './releases/phproject.zip';
      try {
        const metaResp = await fetch('./releases/phproject.json');
        if (metaResp.ok) {
          const meta = await metaResp.json();
          setStatus(`Downloading ${meta.name} (${(meta.size / 1048576).toFixed(1)} MB)…`);
        }
      } catch (_) {
        // Metadata is optional; proceed without it
      }

      setProgress(15);

      // 5. Download the Phproject release zip, showing streaming progress
      let zipBytes;
      try {
        const zipResp = await fetch(zipUrl);
        if (!zipResp.ok) throw new Error('Download failed — HTTP ' + zipResp.status);

        const contentLength = zipResp.headers.get('Content-Length');
        const total = contentLength ? parseInt(contentLength, 10) : 0;
        const reader = zipResp.body.getReader();
        const chunks = [];
        let received = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          if (total > 0) {
            setProgress(15 + Math.round(35 * received / total));
            setStatus(
              `Downloading Phproject… ${(received / 1048576).toFixed(1)} / `
              + `${(total / 1048576).toFixed(1)} MB`
            );
          }
        }

        const buffer = new Uint8Array(received);
        let offset = 0;
        for (const chunk of chunks) { buffer.set(chunk, offset); offset += chunk.length; }
        zipBytes = buffer;
      } catch (err) {
        showError('Download failed:\n' + err.message);
        return;
      }

      setStatus('Writing archive to virtual filesystem…');
      setProgress(52);

      // 6. Write the zip into the WASM filesystem
      try {
        await sendMessage('writeFile', ['/persist/phproject.zip', zipBytes]);
      } catch (err) {
        showError('Could not write zip to WASM filesystem:\n' + err.message);
        return;
      }

      setProgress(56);

      // 7. Write the install configuration that setup.php will read
      const installConfig = {
        username: 'admin',
        password: 'admin',
        email:    'admin@localhost',
        siteName: 'Phproject',
      };
      const installConfigJson = JSON.stringify(installConfig);
      try {
        const configBytes = new TextEncoder().encode(installConfigJson);
        await sendMessage('writeFile', ['/config/install.json', configBytes]);
      } catch (err) {
        showError('Could not write install config:\n' + err.message);
        return;
      }

      setStatus('Initialising PHP runtime and extracting Phproject…\n(this may take a minute on first run while the PHP extensions are loaded)');
      progressEl.classList.add('indeterminate');

      // Ensure setup.php is present in WASM FS even if preloading is unavailable.
      // We seed both /config and /persist/phproject so setup can run via
      // /app/setup.php on the main app vHost.
      let setupText = '';
      try {
        const setupSource = await fetch('./scripts/setup.php', { cache: 'no-store' });
        if (!setupSource.ok) {
          throw new Error('Could not download scripts/setup.php (HTTP ' + setupSource.status + ')');
        }

        setupText = await setupSource.text();
        const setupBytes = new TextEncoder().encode(setupText);
        try {
          await sendMessage('mkdir', ['/persist/phproject']);
        } catch (_) {
          // Directory may already exist.
        }
        await sendMessage('writeFile', ['/config/setup.php', setupBytes]);
        await sendMessage('writeFile', ['/persist/phproject/setup.php', setupBytes]);
      } catch (err) {
        showError('Could not prepare setup script:\n' + err.message);
        return;
      }

      // Preflight: ensure setup.php is available where setup execution expects it.
      try {
        const setupScript = await sendMessage('analyzePath', ['/persist/phproject/setup.php']);
        if (!setupScript || !setupScript.exists) {
          throw new Error('/persist/phproject/setup.php not found in WASM filesystem');
        }
      } catch (err) {
        showError('Setup preflight failed:\n' + err.message);
        return;
      }

      // 8. Run setup.php inside the service worker. This avoids first-load
      //    fetch interception races while still triggering full PHP setup.
      let setupResult;
      try {
        const setupResp = await sendMessage('runSetupScript', [zipBytes, installConfigJson, setupText]);
        if (!setupResp || !setupResp.ok) {
          const status = setupResp && typeof setupResp.status === 'number'
            ? setupResp.status
            : 'unknown';
          const body = setupResp && typeof setupResp.body === 'string'
            ? setupResp.body
            : '';
          throw new Error(`HTTP ${status}: ${body}`);
        }

        setupResult = JSON.parse(setupResp.body || '{}');
        if (!setupResult.success) {
          throw new Error(setupResult.error || 'Unknown setup error');
        }
      } catch (err) {
        showError('Setup script failed:\n' + err.message
          + '\n\nOpen the browser DevTools console for PHP error output.');
        return;
      }

      setStatus('Installation complete — loading Phproject…');
      progressEl.classList.remove('indeterminate');
      setProgress(100);

      await new Promise(r => setTimeout(r, 600));
      window.location.href = './app/';
    }

    main().catch(err => showError('Unexpected error:\n' + err.message));
  </script>
</body>
</html>
